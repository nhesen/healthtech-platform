services:
  - type: web
    name: healthtech-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: python -m app.migrate
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: ""
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: CV_SERVICE_TOKEN
        generateValue: true
      - key: CV_HOSPITAL_ID
        value: hospital_caspian
    disk:
      name: healthtech-private-uploads
      mountPath: /data
      sizeGB: 1
